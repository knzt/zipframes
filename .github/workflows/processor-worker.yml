# Checks for the processor-worker.
#
# Pull requests targeting main always run this suite so every synchronize
# is covered. Pushes to main still filter by path so an untouched service
# is skipped on merge. The image build uses the staged runtime; it does
# not download packages again.
name: processor-worker

on:
  # Publishes the current main without a code change, e.g. the first image.
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'services/processor-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/processor-worker.yml'
      - '.github/workflows/service-ci.yml'

concurrency:
  group: processor-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # publish pushes the image and commits the new tag; the reusable
    # workflow cannot raise permissions above these.
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: processor-worker
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      image: zipframes-processor-worker:local
      stage_runtime: true
      # Sonar reports coverage from the lcov the coverage run writes.
      coverage: true
      sonar: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
