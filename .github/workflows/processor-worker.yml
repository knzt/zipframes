# Checks scoped to the processor-worker.
#
# Triggered by path, so a change to another service does not run this suite.
# The image build uses the staged runtime; it does not download packages again.
name: processor-worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/processor-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/processor-worker.yml'
      - '.github/workflows/service-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/processor-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/processor-worker.yml'
      - '.github/workflows/service-ci.yml'

concurrency:
  group: processor-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: processor-worker
      image: zipframes-processor-worker:local
      stage_runtime: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
