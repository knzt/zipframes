# Repository-wide checks that are not a service.
#
# Each service is built, tested, and imaged by its own workflow
# (auth-service.yml, processor-worker.yml), which calls service-ci.yml.
# This workflow covers what is shared: formatting and the AsyncAPI contract.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

  contracts:
    name: AsyncAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job only validates the event spec. It does not install the repo.
          package-manager-cache: false

      # OpenAPI is generated by each HTTP service from its route schemas and
      # covered by that service's tests. The AsyncAPI file is still the
      # event contract shared by services that are not all implemented yet.
      - name: Validate the AsyncAPI spec
        run: npx --yes @asyncapi/cli@4 validate docs/asyncapi/events.yaml
