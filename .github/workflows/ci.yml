# Workflow raiz: roda lint e typecheck nos pacotes compartilhados.
# Cada serviço tem seu próprio workflow disparado por filtro de caminho.
name: ci-root

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - 'commitlint.config.mjs'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'

concurrency:
  group: ci-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Prettier (verificação)
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
