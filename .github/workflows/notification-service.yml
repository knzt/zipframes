# Checks for the notification-service.
#
# Pull requests targeting main always run this suite so every synchronize
# is covered. Pushes to main still filter by path so an untouched service
# is skipped on merge.
name: notification-service

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'services/notification-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/notification-service.yml'
      - '.github/workflows/service-ci.yml'

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: notification-service
      image: zipframes-notification-service:local
      prisma: true
      coverage: true
      docker_secret: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
