# Checks scoped to the auth-service.
#
# Triggered by path, so a change to another service does not run this suite.
name: auth-service

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/auth-service.yml'
      - '.github/workflows/service-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/auth-service.yml'
      - '.github/workflows/service-ci.yml'

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: auth-service
      image: zipframes-auth-service:local
      prisma: true
      coverage: true
      docker_secret: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
