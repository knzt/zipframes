# Checks for the auth-service.
#
# Pull requests targeting main always run this suite so every synchronize
# is covered. Pushes to main still filter by path so an untouched service
# is skipped on merge.
name: auth-service

on:
  # Publishes the current main without a code change, e.g. the first image.
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.mjs'
      - '.github/workflows/auth-service.yml'
      - '.github/workflows/service-ci.yml'

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # publish pushes the image and commits the new tag; the reusable
    # workflow cannot raise permissions above these.
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: auth-service
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      image: zipframes-auth-service:local
      prisma: true
      coverage: true
      docker_secret: true
      sonar: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      # A global analysis token covers every project in the organization, so
      # the four services share this secret.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
