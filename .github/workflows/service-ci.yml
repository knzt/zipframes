# Reusable checks for one service: install, test, and an image.
# Callers on push to main may filter by path. Pull requests targeting
# main always invoke this. With `publish`, the image that passed both
# jobs is pushed to GHCR as :<sha> and :main, and :<sha> is written to
# infra/k8s/<service>/kustomization.yaml on main for Argo CD to roll out.
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Directory name under services/
        required: true
        type: string
      image:
        description: Local image tag. It is pushed only under the GHCR name.
        required: true
        type: string
      publish:
        description: Push the tested image to ghcr.io/<owner>/zipframes-<service>
        type: boolean
        default: false
      prisma:
        description: Generate the Prisma client before typecheck and tests
        type: boolean
        default: false
      coverage:
        description: Run vitest with coverage
        type: boolean
        default: false
      stage_runtime:
        description: Stage production node_modules before the image build
        type: boolean
        default: false
      docker_secret:
        description: Pass NODE_AUTH_TOKEN into the image build as a BuildKit secret
        type: boolean
        default: false
    secrets:
      NODE_AUTH_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Test and image
    runs-on: ubuntu-latest
    # NODE_AUTH_TOKEN is a secret on the Actions environment. A reusable
    # job uses that environment secret instead of the value passed by the caller.
    environment: Actions
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            services/${{ inputs.service }}/pnpm-lock.yaml
          # pnpm 12 does not expand ${NODE_AUTH_TOKEN} in a committed .npmrc.
          # setup-node writes that credential to a user-level file instead.
          registry-url: https://npm.pkg.github.com
          scope: '@zipframes'

      # The root lockfile is repo tooling only. The service install below
      # uses services/<service>/pnpm-lock.yaml.
      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install the service
        working-directory: services/${{ inputs.service }}
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        if: ${{ inputs.prisma }}
        working-directory: services/${{ inputs.service }}
        run: pnpm db:generate

      - name: Typecheck
        working-directory: services/${{ inputs.service }}
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint services/${{ inputs.service }}

      - name: Layer rules
        run: pnpm exec depcruise --config .dependency-cruiser.mjs services/${{ inputs.service }}/src

      - name: Test
        if: ${{ !inputs.coverage }}
        working-directory: services/${{ inputs.service }}
        run: pnpm test:unit

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        working-directory: services/${{ inputs.service }}
        run: pnpm test:coverage

      - name: Build
        working-directory: services/${{ inputs.service }}
        run: pnpm build

      - name: Stage the production runtime
        if: ${{ inputs.stage_runtime }}
        working-directory: services/${{ inputs.service }}
        run: pnpm stage-runtime

      # The source label links the GHCR package to this repository.
      - name: Build the local image
        run: |
          if [ "${{ inputs.docker_secret }}" = "true" ]; then
            docker build \
              --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --file "services/${{ inputs.service }}/Dockerfile" \
              --tag "${{ inputs.image }}" \
              .
          else
            docker build \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --tag "${{ inputs.image }}" \
              "services/${{ inputs.service }}"
          fi

      # The publish job pushes this exact image, not a rebuild.
      - name: Save the image
        if: ${{ inputs.publish }}
        run: docker save "${{ inputs.image }}" | gzip > image.tar.gz

      - name: Upload the image
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.service }}
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  integration:
    name: Integration
    runs-on: ubuntu-latest
    environment: Actions
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            services/${{ inputs.service }}/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@zipframes'

      - name: Docker
        run: docker info

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install the service
        working-directory: services/${{ inputs.service }}
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        if: ${{ inputs.prisma }}
        working-directory: services/${{ inputs.service }}
        run: pnpm db:generate

      - name: Integration tests
        working-directory: services/${{ inputs.service }}
        run: pnpm test:integration

  publish:
    name: Publish to GHCR
    if: ${{ inputs.publish }}
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      # contents: write commits the new tag to the manifests.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.service }}
          path: ${{ runner.temp }}/image

      - name: Load the tested image
        run: gunzip -c "${{ runner.temp }}/image/image.tar.gz" | docker load

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # GHCR names must be lowercase. :<sha> is what the manifests run;
      # :main is a convenience tag for `docker pull`.
      - name: Push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zipframes-${{ inputs.service }}"
          for tag in "${GITHUB_SHA}" main; do
            docker tag "${{ inputs.image }}" "${repo}:${tag}"
            docker push "${repo}:${tag}"
          done
          echo "Pushed \`${repo}:${GITHUB_SHA}\` and \`:main\`" >> "$GITHUB_STEP_SUMMARY"

      # This is the deploy: Argo CD watches infra/ on main and rolls out the
      # new tag. A push made with GITHUB_TOKEN does not start other workflows,
      # so this commit does not trigger CI again. The four services can
      # publish at once; each touches its own file, so a rebase is enough.
      - name: Pin the tag in the manifests
        env:
          KUSTOMIZATION: infra/k8s/${{ inputs.service }}/kustomization.yaml
        run: |
          yq -i '.images[0].newTag = strenv(GITHUB_SHA)' "$KUSTOMIZATION"
          if git diff --quiet -- "$KUSTOMIZATION"; then
            echo "The manifests already run ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION"
          git commit -m "chore(deploy): ${{ inputs.service }} ${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Manifests now run \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not push the new tag" >&2
          exit 1
