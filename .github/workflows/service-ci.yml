# Reusable checks for one service: install, test, and an image.
# Callers on push to main may filter by path. Pull requests targeting
# main always invoke this. With `publish`, the image that passed both
# jobs is pushed to GHCR as :<sha> and :main, and :<sha> is written to
# infra/k8s/<service>/kustomization.yaml on main for Argo CD to roll out.
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Directory name under services/
        required: true
        type: string
      image:
        description: Local image tag. It is pushed only under the GHCR name.
        required: true
        type: string
      publish:
        description: Push the tested image to ghcr.io/<owner>/zipframes-<service>
        type: boolean
        default: false
      prisma:
        description: Generate the Prisma client before typecheck and tests
        type: boolean
        default: false
      coverage:
        description: Run vitest with coverage
        type: boolean
        default: false
      stage_runtime:
        description: Stage production node_modules before the image build
        type: boolean
        default: false
      docker_secret:
        description: Pass NODE_AUTH_TOKEN into the image build as a BuildKit secret
        type: boolean
        default: false
      sonar:
        description: |
          Send the analysis to SonarQube Cloud and fail the job on a red
          quality gate. Needs `coverage: true`, a SONAR_TOKEN that can both
          analyse and read this service's project, and
          services/<service>/sonar-project.properties.
        type: boolean
        default: false
    secrets:
      NODE_AUTH_TOKEN:
        required: true
      SONAR_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Test and image
    runs-on: ubuntu-latest
    # NODE_AUTH_TOKEN is a secret on the Actions environment. A reusable
    # job uses that environment secret instead of the value passed by the caller.
    environment: Actions
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar reads the git history to attribute new code to a commit
          # and an author. A shallow clone leaves that blame blank.
          fetch-depth: ${{ inputs.sonar && 0 || 1 }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            services/${{ inputs.service }}/pnpm-lock.yaml
          # pnpm 12 does not expand ${NODE_AUTH_TOKEN} in a committed .npmrc.
          # setup-node writes that credential to a user-level file instead.
          registry-url: https://npm.pkg.github.com
          scope: '@zipframes'

      # The root lockfile is repo tooling only. The service install below
      # uses services/<service>/pnpm-lock.yaml.
      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install the service
        working-directory: services/${{ inputs.service }}
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        if: ${{ inputs.prisma }}
        working-directory: services/${{ inputs.service }}
        run: pnpm db:generate

      - name: Typecheck
        working-directory: services/${{ inputs.service }}
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint services/${{ inputs.service }}

      - name: Layer rules
        run: pnpm exec depcruise --config .dependency-cruiser.mjs services/${{ inputs.service }}/src

      - name: Test
        if: ${{ !inputs.coverage }}
        working-directory: services/${{ inputs.service }}
        run: pnpm test:unit

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        working-directory: services/${{ inputs.service }}
        run: pnpm test:coverage

      # Reads services/<service>/sonar-project.properties. On a pull request
      # the action derives the PR decoration from the event payload, so the
      # analysis lands on the PR instead of on the branch.
      - name: SonarQube Cloud
        if: ${{ inputs.sonar }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: services/${{ inputs.service }}
      - name: SonarQube quality gate
        if: ${{ inputs.sonar }}
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: services/${{ inputs.service }}/.scannerwork/report-task.txt

      - name: Build
        working-directory: services/${{ inputs.service }}
        run: pnpm build

      - name: Stage the production runtime
        if: ${{ inputs.stage_runtime }}
        working-directory: services/${{ inputs.service }}
        run: pnpm stage-runtime

      # The source label links the GHCR package to this repository.
      - name: Build the local image
        run: |
          if [ "${{ inputs.docker_secret }}" = "true" ]; then
            docker build \
              --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --file "services/${{ inputs.service }}/Dockerfile" \
              --tag "${{ inputs.image }}" \
              .
          else
            docker build \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --tag "${{ inputs.image }}" \
              "services/${{ inputs.service }}"
          fi

      # The publish job pushes this exact image, not a rebuild.
      - name: Save the image
        if: ${{ inputs.publish }}
        run: docker save "${{ inputs.image }}" | gzip > image.tar.gz

      - name: Upload the image
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.service }}
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  integration:
    name: Integration
    runs-on: ubuntu-latest
    environment: Actions
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            services/${{ inputs.service }}/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@zipframes'

      - name: Docker
        run: docker info

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install the service
        working-directory: services/${{ inputs.service }}
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        if: ${{ inputs.prisma }}
        working-directory: services/${{ inputs.service }}
        run: pnpm db:generate

      - name: Integration tests
        working-directory: services/${{ inputs.service }}
        run: pnpm test:integration

  publish:
    name: Publish to GHCR
    if: ${{ inputs.publish }}
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      # contents: write commits the new tag to the manifests.
      contents: write
      packages: write
      # pull-requests: write opens and merges the deploy PR below.
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.service }}
          path: ${{ runner.temp }}/image

      - name: Load the tested image
        run: gunzip -c "${{ runner.temp }}/image/image.tar.gz" | docker load

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # GHCR names must be lowercase. :<sha> is what the manifests run;
      # :main is a convenience tag for `docker pull`.
      - name: Push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zipframes-${{ inputs.service }}"
          for tag in "${GITHUB_SHA}" main; do
            docker tag "${{ inputs.image }}" "${repo}:${tag}"
            docker push "${repo}:${tag}"
          done
          echo "Pushed \`${repo}:${GITHUB_SHA}\` and \`:main\`" >> "$GITHUB_STEP_SUMMARY"

      # This is the deploy: Argo CD watches infra/ on main and rolls out the
      # new tag. main takes changes only through a pull request and enforces
      # admins, so the tag goes through a PR opened and merged here. A PR
      # created with GITHUB_TOKEN does not start workflows, so this neither
      # runs CI again nor recurses into another deploy.
      - name: Pin the tag in the manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KUSTOMIZATION: infra/k8s/${{ inputs.service }}/kustomization.yaml
        run: |
          yq -i '.images[0].newTag = strenv(GITHUB_SHA)' "$KUSTOMIZATION"
          if git diff --quiet -- "$KUSTOMIZATION"; then
            echo "The manifests already run ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          short="${GITHUB_SHA::7}"
          branch="deploy/${{ inputs.service }}-${short}"
          title="chore(deploy): ${{ inputs.service }} ${short}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$KUSTOMIZATION"
          git commit -m "$title"
          git push origin "$branch"

          gh pr create --base main --head "$branch" --title "$title" \
            --body "Rolls ${{ inputs.service }} out to \`${short}\`, published to GHCR by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Opened and merged by the pipeline; Argo CD applies it from main."

          # The four services can publish at once. Each touches its own file,
          # so they never conflict, but one merge does move main out from
          # under the others: rebase and try again.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --delete-branch; then
              echo "Manifests now run \`${short}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main && git push --force-with-lease origin "$branch"
          done

          echo "Could not merge the deploy pull request for ${short}" >&2
          exit 1
