# pnpm 12 reads install-script approval from this file.
# No packages list: this service is not installed with the others.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@zipframes/core@0.4.0 || 0.5.0-pr50-20260928112543'
  - '@zipframes/test-toolkit@0.2.1'
  - '@zipframes/communication@0.3.0-pr50-20260928112543'
  - '@zipframes/schemas@1.0.0-pr50-20260928112543'
