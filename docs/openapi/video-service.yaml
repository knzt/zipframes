openapi: 3.1.0
info:
  title: ZipFrames — video-service
  version: '1.0.0'
  description: |
    Ciclo de vida do vídeo: solicitação e confirmação de upload, listagem,
    detalhe, download e exclusão.

    O byte do vídeo nunca passa por este serviço: upload e download
    acontecem direto no object storage, por URL pré-assinada (ADR-0009).
    Um vídeo de outro usuário simplesmente não existe para quem pede —
    a resposta é 404, nunca 403 (ver `docs/domain/dominio.md`).
  contact:
    name: ZipFrames
    url: https://github.com/knzt/zipframes
externalDocs:
  description: Domínio de Gestão de Vídeos e política de retenção
  url: https://github.com/knzt/zipframes/blob/main/docs/domain/dominio.md

servers:
  - url: /videos
    description: Roteado pelo Ingress a partir do host público

security:
  - bearerAuth: []

tags:
  - name: Vídeos
    description: Upload, status, download e exclusão
  - name: Interno
    description: Endpoints acessíveis apenas dentro do cluster

paths:
  /:
    post:
      operationId: requestUpload
      tags: [Vídeos]
      summary: Cria o vídeo e devolve a URL de upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadBody'
      responses:
        '201':
          description: Vídeo criado em AWAITING_UPLOAD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUploadResponse'
        '400':
          description: |
            Extensão não aceita (as válidas são mp4, avi, mov, mkv, wmv, flv
            e webm) ou tamanho declarado acima do limite configurado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      operationId: listVideos
      tags: [Vídeos]
      summary: Lista os vídeos do usuário autenticado, paginado
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página da listagem, mais recente primeiro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      operationId: getVideo
      tags: [Vídeos]
      summary: Detalha um vídeo
      responses:
        '200':
          description: Detalhe do vídeo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteVideo
      tags: [Vídeos]
      summary: Exclui o vídeo a pedido do dono
      description: |
        Apaga os arquivos que ainda existirem no storage e leva o vídeo a
        `DELETED`. Os metadados mínimos do histórico são preservados.
      responses:
        '204':
          description: Excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{videoId}/confirm:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      operationId: confirmUpload
      tags: [Vídeos]
      summary: Confirma o upload e coloca o vídeo na fila de processamento
      description: |
        Só é aceito quando o vídeo está em `AWAITING_UPLOAD` e o objeto
        existe no storage, com o tamanho conferido.
      responses:
        '202':
          description: Aceito; o vídeo passa a QUEUED e entra na fila
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            O vídeo não está em AWAITING_UPLOAD (já foi confirmado, ou já
            avançou), ou o objeto ainda não existe no storage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /{videoId}/download:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      operationId: getDownloadUrl
      tags: [Vídeos]
      summary: Devolve a URL de download do pacote de frames
      responses:
        '200':
          description: URL de download válida por 5 minutos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O vídeo ainda não está `DONE`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: |
            O pacote expirou (janela de 24h vencida) ou o vídeo foi
            excluído. A orientação é enviar o vídeo novamente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /health/live:
    get:
      operationId: getLiveness
      tags: [Interno]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: O processo está de pé

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Interno]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
        '503':
          description: Ainda não pronto (ex. sem conexão com o banco ou o broker)

  /metrics:
    get:
      operationId: getMetrics
      tags: [Interno]
      summary: Métricas no formato do Prometheus
      security: []
      responses:
        '200':
          description: Métricas em texto simples
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT assinado com RS256 pelo auth-service, validado aqui contra o
        JWKS publicado em `/auth/.well-known/jwks.json` (ADR-0011). O dono
        do vídeo é o `sub` do token.

  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor da página anterior, devolvido em `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: |
        O vídeo não existe, ou não pertence a quem pediu — as duas
        situações respondem da mesma forma, de propósito.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    VideoStatus:
      type: string
      enum:
        - AWAITING_UPLOAD
        - QUEUED
        - PROCESSING
        - DONE
        - FAILED
        - EXPIRED
        - DELETED

    RequestUploadBody:
      type: object
      required: [originalFileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        originalFileName:
          type: string
          maxLength: 255
          description: Nome informado pelo cliente; a extensão é validada.
          example: aniversario.mp4
        contentType:
          type: string
          example: video/mp4
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            Tamanho declarado. É conferido de novo, contra o objeto real no
            storage, na confirmação. O limite máximo é configurável (por
            exemplo, 500 MB).
          example: 52428800

    RequestUploadResponse:
      type: object
      required: [id, uploadUrl, expiresAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: URL de PUT pré-assinada, válida por 15 minutos.
        expiresAt:
          type: string
          format: date-time

    VideoSummary:
      type: object
      required: [id, originalFileName, status, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        originalFileName:
          type: string
        status:
          $ref: '#/components/schemas/VideoStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VideoDetail:
      allOf:
        - $ref: '#/components/schemas/VideoSummary'
        - type: object
          required: [contentType, sizeBytes]
          additionalProperties: false
          properties:
            contentType:
              type: string
            sizeBytes:
              type: integer
              format: int64
            frameCount:
              type: [integer, 'null']
            failureReason:
              type: [string, 'null']
            expiresAt:
              type: [string, 'null']
              format: date-time
              description: Preenchido quando o status é DONE.

    VideoListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoSummary'
        nextCursor:
          type: [string, 'null']

    DownloadResponse:
      type: object
      required: [downloadUrl, expiresAt]
      additionalProperties: false
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: |
        Formato de erro comum a todos os serviços (RFC 9457). Nunca inclui
        detalhes internos, como stack traces ou saída do ffmpeg.
      required: [type, title, status]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          format: uuid
