openapi: 3.1.0
info:
  title: ZipFrames — auth-service
  version: '1.0.0'
  description: |
    Cadastro, autenticação e emissão de tokens.

    Este serviço não conhece vídeos: sua única responsabilidade é identidade.
    Os demais serviços validam o token localmente contra as chaves publicadas
    aqui, sem chamar o auth-service a cada requisição (ver
    `docs/domain/dominio.md` e `docs/architecture/layers.md`).
  contact:
    name: ZipFrames
    url: https://github.com/knzt/zipframes
externalDocs:
  description: Domínio de Identidade
  url: https://github.com/knzt/zipframes/blob/main/docs/domain/dominio.md

servers:
  - url: /auth
    description: Roteado pelo Ingress a partir do host público

tags:
  - name: Identidade
    description: Cadastro, login e chaves públicas
  - name: Interno
    description: Endpoints acessíveis apenas dentro do cluster

paths:
  /register:
    post:
      operationId: registerUser
      tags: [Identidade]
      summary: Cadastra um usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: |
            Dados inválidos — e-mail em formato incorreto, ou senha fora da
            política mínima (ao menos 8 caracteres, com letras e números).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Já existe uma conta com este e-mail
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /login:
    post:
      operationId: login
      tags: [Identidade]
      summary: Autentica e devolve o token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: |
            Credenciais inválidas. A mesma mensagem é usada para e-mail
            inexistente e para senha incorreta, para não revelar quais
            e-mails estão cadastrados (ver `docs/domain/dominio.md`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [Identidade]
      summary: Chaves públicas para validar o token (JWKS, RFC 7517)
      description: |
        Os demais serviços buscam este endpoint e mantêm as chaves em cache
        local, identificando qual usar pelo `kid` no cabeçalho do JWT (ver
        ADR-0011).
      security: []
      responses:
        '200':
          description: Conjunto de chaves públicas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /health/live:
    get:
      operationId: getLiveness
      tags: [Interno]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: O processo está de pé

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Interno]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
        '503':
          description: Ainda não pronto (ex. sem conexão com o banco)

  /metrics:
    get:
      operationId: getMetrics
      tags: [Interno]
      summary: Métricas no formato do Prometheus
      security: []
      responses:
        '200':
          description: Métricas em texto simples
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Hellen Santos
        email:
          type: string
          format: email
          maxLength: 255
          example: hellen@example.com
        password:
          type: string
          minLength: 8
          format: password
          description: Ao menos 8 caracteres, com letras e números.
          example: correta-horse-1

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UserResponse:
      type: object
      required: [id, name, email, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT assinado com RS256.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Validade do token em segundos.
          example: 900

    Jwk:
      type: object
      description: Uma chave pública no formato JWK (RFC 7517), família RSA.
      required: [kty, use, alg, kid, n, e]
      additionalProperties: false
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        kid:
          type: string
          description: Identifica a chave; é a mesma claim `kid` do cabeçalho do JWT.
        n:
          type: string
          description: Módulo RSA, codificado em base64url.
        e:
          type: string
          description: Expoente RSA, codificado em base64url.

    Jwks:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    ProblemDetails:
      type: object
      description: |
        Formato de erro comum a todos os serviços (RFC 9457). Nunca inclui
        detalhes internos, como stack traces.
      required: [type, title, status]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Credenciais inválidas
        status:
          type: integer
          example: 401
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          format: uuid
