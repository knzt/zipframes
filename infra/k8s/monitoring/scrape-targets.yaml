---
# The RabbitMQ Cluster Operator enables the Prometheus plugin on port 15692.
# /metrics is the node-level view; queue_coarse_metrics adds the size of
# each queue, which the worker backlog and the DLQ alerts need.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
spec:
  namespaceSelector:
    matchNames: [zipframes]
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 15s
      relabelings:
        - targetLabel: job
          replacement: rabbitmq
    - port: prometheus
      path: /metrics/detailed
      params:
        family: [queue_coarse_metrics]
      interval: 15s
      # A job of its own: same host and port as the endpoint above, so the
      # two targets would otherwise have identical labels.
      relabelings:
        - targetLabel: job
          replacement: rabbitmq-queues
