# What Prometheus scrapes. The HTTP services are found through their
# Service; the worker and the notifier have no Service, so their pods are
# scraped directly on the operations port. `job` is set to the service name
# so every query can filter by it, and honorLabels keeps the `service` and
# `version` labels each process already puts on its metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service
spec:
  namespaceSelector:
    matchNames: [zipframes]
  selector:
    matchLabels:
      app: auth-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      honorLabels: true
      relabelings:
        - targetLabel: job
          replacement: auth-service
