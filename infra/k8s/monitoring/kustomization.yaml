# Prometheus, Alertmanager and Grafana for ZipFrames. The Prometheus
# Operator (its CRDs and controller) is installed by infra/kind/bootstrap.sh;
# this declares the instances, what they scrape, the alert rules and the
# dashboard. The Grafana admin password is the grafana-admin Secret the
# bootstrap creates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml
  - scrape-targets.yaml
  - alert-rules.yaml
  - ingress.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/zipframes.json
