# One CloudNativePG cluster per service, as in the Compose file.
# Each reaches its service at <name>-rw:5432. The owner and password come
# from the <name>-credentials Secret (basic-auth) the bootstrap creates.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: auth-db
  namespace: zipframes
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: auth_db
      owner: zipframes
      secret:
        name: auth-db-credentials
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
---
