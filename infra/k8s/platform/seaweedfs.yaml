# S3-compatible storage, one process as in the Compose file.
# The `seaweedfs-s3` Secret (created by the bootstrap) holds s3.json and the
# same key pair under accessKey/secretKey for the bucket Job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: zipframes
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: zipframes
  labels:
    app: seaweedfs
spec:
  replicas: 1
  # The volume is ReadWriteOnce; two pods cannot hold it during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=1024
            - -volume.max=10
            - -filer
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /cluster/healthz
              port: master
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /cluster/healthz
              port: master
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
            items:
              - key: s3.json
                path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: zipframes
  labels:
    app: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
# Creates the `videos` bucket, like storage-init in the Compose file.
# As an Argo CD hook it runs again on each sync; creating an existing
# bucket is a no-op here because head-bucket is tried as well.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bucket
  namespace: zipframes
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.27.30
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3
                  key: secretKey
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command: ['/bin/sh', '-c']
          args:
            - >
              aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket videos ||
              aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket videos
