apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-service
  namespace: zipframes
  labels:
    app: notifier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier-service
  template:
    metadata:
      labels:
        app: notifier-service
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: notifier-service
          image: ghcr.io/knzt/zipframes-notifier-service:main
          # The tag comes from kustomization.yaml (a commit SHA, never reused).
          imagePullPolicy: IfNotPresent
          ports:
            - name: operations
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: notifier-service
            - secretRef:
                name: notifier-service
          readinessProbe:
            httpGet:
              path: /health/ready
              port: operations
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: operations
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
