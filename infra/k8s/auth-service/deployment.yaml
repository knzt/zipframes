apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: zipframes
  labels:
    app: auth-service
spec:
  # No replicas: the autoscaler owns it, and Argo CD would reset it otherwise.
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: ghcr.io/knzt/zipframes-auth-service:main
          # :main moves on every publish; a restart pulls the newest.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: auth-service
            - secretRef:
                name: auth-service
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
