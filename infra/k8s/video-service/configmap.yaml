apiVersion: v1
kind: ConfigMap
metadata:
  name: video-service
  namespace: zipframes
data:
  PORT: '3001'
  CORS_ORIGIN: '*'
  REDIS_URL: redis://redis.zipframes.svc.cluster.local:6379
  S3_ENDPOINT: http://seaweedfs.zipframes.svc.cluster.local:8333
  # Host the browser reaches through the Ingress; the download URLs are signed for it.
  S3_PUBLIC_ENDPOINT: https://storage.zipframes.local
  S3_REGION: us-east-1
  S3_BUCKET: videos
  S3_FORCE_PATH_STYLE: 'true'
  JWT_JWKS_URL: http://auth-service.zipframes.svc.cluster.local:3000/.well-known/jwks.json
  JWT_ISSUER: https://auth.zipframes.local
  JWT_AUDIENCE: zipframes
  MAX_UPLOAD_BYTES: '524288000'
  DOWNLOAD_URL_TTL_SECONDS: '300'
  RESULT_RETENTION_SECONDS: '86400'
  LIST_CACHE_TTL_SECONDS: '60'
  EXPIRATION_SWEEP_INTERVAL_MS: '60000'
  EXPIRATION_BATCH_SIZE: '100'
  CONSUMER_PREFETCH: '10'
  MAX_ATTEMPTS: '5'
  RETRY_BASE_DELAY_MS: '1000'
  RETRY_MAX_DELAY_MS: '30000'
  LOG_LEVEL: info
  SERVICE_VERSION: '0.1.0'
