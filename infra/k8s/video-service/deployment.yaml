apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
  namespace: zipframes
  labels:
    app: video-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-service
  template:
    metadata:
      labels:
        app: video-service
    spec:
      # Covers the consumer drain (30s) on SIGTERM.
      terminationGracePeriodSeconds: 40
      containers:
        - name: video-service
          image: zipframes-video-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: video-service
            - secretRef:
                name: video-service
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
