apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
  namespace: zipframes
  labels:
    app: video-service
spec:
  # No replicas: the autoscaler owns it, and Argo CD would reset it otherwise.
  selector:
    matchLabels:
      app: video-service
  template:
    metadata:
      labels:
        app: video-service
    spec:
      # Covers the consumer drain (30s) on SIGTERM.
      terminationGracePeriodSeconds: 40
      containers:
        - name: video-service
          image: ghcr.io/knzt/zipframes-video-service:main
          # The tag comes from kustomization.yaml (a commit SHA, never reused).
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: video-service
            - secretRef:
                name: video-service
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
