apiVersion: v1
kind: ConfigMap
metadata:
  name: processor-worker
  namespace: zipframes
data:
  S3_ENDPOINT: http://seaweedfs.zipframes.svc.cluster.local:8333
  S3_REGION: us-east-1
  S3_BUCKET: videos
  S3_FORCE_PATH_STYLE: 'true'
  WORK_DIR: /tmp/zipframes-processor
  PROCESSING_TIMEOUT_MS: '300000'
  MAX_ATTEMPTS: '5'
  RETRY_BASE_DELAY_MS: '1000'
  RETRY_MAX_DELAY_MS: '30000'
  HEALTH_PORT: '8081'
  METRICS_PORT: '9091'
  LOG_LEVEL: info
  SERVICE_VERSION: '0.0.0'
