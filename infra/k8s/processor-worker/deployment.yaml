apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-worker
  namespace: zipframes
  labels:
    app: processor-worker
spec:
  # No replicas: the autoscaler owns it, and Argo CD would reset it otherwise.
  selector:
    matchLabels:
      app: processor-worker
  template:
    metadata:
      labels:
        app: processor-worker
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: processor-worker
          image: ghcr.io/knzt/zipframes-processor-worker:main
          # The tag comes from kustomization.yaml (a commit SHA, never reused).
          imagePullPolicy: IfNotPresent
          ports:
            - name: operations
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: processor-worker
            - secretRef:
                name: processor-worker
          readinessProbe:
            httpGet:
              path: /health/ready
              port: operations
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: operations
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
