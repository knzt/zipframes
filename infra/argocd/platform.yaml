# Databases, broker, cache, storage, mail and their Ingress. The CRDs come
# from the operators the bootstrap installs before Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: default
  source:
    repoURL: https://github.com/knzt/zipframes.git
    targetRevision: main
    path: infra/k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: zipframes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
