# Prometheus, Alertmanager and Grafana. The Prometheus Operator CRDs come
# from infra/kind/bootstrap.sh, installed before Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knzt/zipframes.git
    targetRevision: main
    path: infra/k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
