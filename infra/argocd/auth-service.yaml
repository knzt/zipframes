apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knzt/zipframes.git
    targetRevision: main
    path: infra/k8s/auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: zipframes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The platform Application owns the namespace; until it syncs, retry.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
