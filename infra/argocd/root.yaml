# App of apps: the bootstrap applies only this file, and Argo CD creates
# the other Applications in this directory from main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zipframes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knzt/zipframes.git
    targetRevision: main
    path: infra/argocd
    directory:
      exclude: root.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
